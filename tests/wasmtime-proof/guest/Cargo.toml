[package]
name = "ashell-p3-hello"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[features]
https = []

[dependencies]
wit-bindgen = { version = "=0.61.1", features = ["async-spawn", "inter-task-wakeup"] }
futures = { version = "0.3", default-features = false, features = ["std", "async-await"] }

[profile.release]
opt-level = "s"
panic = "abort"
strip = "debuginfo"
