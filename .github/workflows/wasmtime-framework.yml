name: Wasmtime command framework

on:
  workflow_dispatch:
  push:
    branches: [ci/wasmtime-framework]

permissions:
  contents: read

jobs:
  framework:
    runs-on: macos-26
    timeout-minutes: 120
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install pinned Rust and iOS targets
        run: |
          rustup toolchain install 1.96.1 --profile minimal --no-self-update
          rustup target add --toolchain 1.96.1 aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios
      - name: Build and package
        run: |
          xcodebuild -version
          uname -m
          bash tests/wasmtime-proof/ci-framework.sh "$RUNNER_TEMP/wasmtime" "$RUNNER_TEMP/dist"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: wasmtime-command
          path: ${{ runner.temp }}/dist/*
          if-no-files-found: error
