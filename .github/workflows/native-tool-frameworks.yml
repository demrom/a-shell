name: Native tool frameworks

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/native-tool-frameworks.yml'
      - 'native-ports/**'
      - 'tests/native-*.sh'

permissions:
  contents: read

jobs:
  framework:
    runs-on: macos-26
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        product: [gh, monolith, dua]
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        if: matrix.product == 'gh'
        with:
          go-version: '1.27.4'
          cache: false
      - name: Install pinned Rust and iOS targets
        if: matrix.product != 'gh'
        run: |
          rustup toolchain install 1.96.1 --profile minimal --no-self-update
          rustup target add --toolchain 1.96.1 aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios
      - name: Build and package
        env:
          PRODUCT: ${{ matrix.product }}
        run: |
          xcodebuild -version
          bash native-ports/ci-framework.sh "$PRODUCT" "$RUNNER_TEMP/native" "$RUNNER_TEMP/dist"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native-${{ matrix.product }}
          path: ${{ runner.temp }}/dist/*
          if-no-files-found: error
