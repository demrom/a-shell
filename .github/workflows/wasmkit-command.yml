name: WasmKitCommand framework
# This CI-only ref uses a short-lived runtime Actions artifact, not a release.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.repository == 'demrom/a-shell' && github.ref == 'refs/heads/ci/wasmkit-process-api'
    # The hosted arm64 pool cancelled this job before checkout.
    runs-on: macos-26-intel
    timeout-minutes: 35
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build and run wasmkit on Simulator
        run: bash scripts/build-wasmkit-command.sh --smoke
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: WasmKitCommand
          include-hidden-files: true
          if-no-files-found: error
          path: .build/wasmkit-command/dist/
