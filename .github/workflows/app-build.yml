name: App build

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.scheme }} (${{ matrix.platform }})
    runs-on: macos-15
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - scheme: a-Shell-noPython
            platform: iOS
            arch: arm64
          - scheme: a-Shell-noPython
            platform: iOS Simulator
            arch: x86_64
          # Apple-silicon Simulator app for manual checks, uploaded below.
          - scheme: a-Shell-mini
            platform: iOS Simulator
            arch: arm64
            upload: true
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Initialize SwiftTerm
        run: git submodule update --init SwiftTerm
      - name: Cache Swift package artifacts
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: xcfs/.build
          key: xcfs-${{ runner.os }}-${{ runner.arch }}-xcode26.3-${{ hashFiles('xcfs/Package.swift', 'xcfs/Package.resolved') }}
      - name: Download frameworks and verify SPM checksums
        run: nice -n 15 ./downloadFrameworks.sh --jobs 4
      - name: Build unsigned app
        env:
          SCHEME: ${{ matrix.scheme }}
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
        run: |
          nice -n 15 xcodebuild -project a-Shell.xcodeproj \
            -scheme "$SCHEME" -configuration Debug \
            -destination "generic/platform=$PLATFORM" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" -jobs 4 \
            ARCHS="$ARCH" \
            CODE_SIGNING_ALLOWED=NO build
      - name: Sign and zip Simulator app
        if: matrix.upload
        env:
          SCHEME: ${{ matrix.scheme }}
        run: |
          app="$RUNNER_TEMP/DerivedData/Build/Products/Debug-iphonesimulator/$SCHEME.app"
          # Startup needs the shared container even on Simulator.
          group=$(plutil -extract AppGroupIdentifier raw -o - "$app/Info.plist")
          entitlements="$RUNNER_TEMP/simulator-app-entitlements.plist"
          /usr/libexec/PlistBuddy -c 'Add :com.apple.security.application-groups array' \
            -c "Add :com.apple.security.application-groups:0 string $group" "$entitlements"
          codesign --force --sign - --entitlements "$entitlements" "$app"
          codesign --verify --deep "$app"
          ditto -c -k --sequesterRsrc --keepParent "$app" "$RUNNER_TEMP/$SCHEME-simulator.zip"
      - name: Upload Simulator app
        if: matrix.upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          path: ${{ runner.temp }}/${{ matrix.scheme }}-simulator.zip
          archive: false
          retention-days: 3
          if-no-files-found: error
