name: App native frameworks
on: workflow_dispatch
permissions:
  contents: read
defaults:
  run:
    shell: bash
env:
  DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
jobs:
  build:
    runs-on: ${{ matrix.product == 'Herdr' && 'macos-26-intel' || 'macos-26' }}
    env:
      DEVELOPER_DIR: ${{ matrix.product == 'Herdr' && '/Applications/Xcode_26.6.app/Contents/Developer' || '/Applications/Xcode_26.3.app/Contents/Developer' }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        product: [Herdr]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-go@v6
        if: matrix.product == 'fzf'
        with:
          go-version: '1.27.2'
          cache: false
      - name: Rust toolchain
        if: matrix.product != 'fzf'
        env:
          PRODUCT: ${{ matrix.product }}
        run: |
          set -euo pipefail
          version=1.96.1
          if [[ "$PRODUCT" == Ruff ]]; then
            version=$(sed -nE "s/^  \\[\\[ .* == 'rustc ([0-9]+\\.[0-9]+\\.[0-9]+) .*$/\\1/p" ruff/build.sh)
            [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Cannot read Rust version from ruff/build.sh" >&2; exit 1; }
          fi
          rustup toolchain install "$version" --profile minimal --no-self-update
          rustup override set "$version"
          rustup target add --toolchain "$version" aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios
          rustc --version
      - name: Install Zig 0.16.0 for Herdr
        if: matrix.product == 'Herdr'
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          archive=zig-x86_64-macos-0.16.0.tar.xz
          curl -fLsS --retry 2 "https://ziglang.org/download/0.16.0/$archive" -o "$archive"
          echo "0387557ed1877bc6a2e1802c8391953baddba76081876301c522f52977b52ba7  $archive" | shasum -a 256 -c -
          tar -xf "$archive"
          echo "ZIG=$RUNNER_TEMP/${archive%.tar.xz}/zig" >>"$GITHUB_ENV"
      - name: Toolchain and resources
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          xcrun --sdk iphonesimulator --show-sdk-version
          uv --version
          df -h .
          sysctl hw.memsize
          sysctl vm.swapusage
      - name: Build and audit pinned product
        env:
          PRODUCT: ${{ matrix.product }}
        run: nice -n 15 bash ci/native-frameworks.sh "$PRODUCT"
      - uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.product }}
          include-hidden-files: true
          if-no-files-found: error
          path: .build/dist/*
      - name: Retain diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.product }}-logs
          include-hidden-files: true
          if-no-files-found: ignore
          path: .build/native/**/*.log
